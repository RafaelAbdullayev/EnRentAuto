# ═══════════════════════════════════════════════════════════════════════════
# nginx-конфиг для портфолио на VPS Timeweb
# Положить в: /etc/nginx/sites-available/portfolio
# Включить:   ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#
# ЗАМЕНИТЬ example.com на свой домен (две строки server_name ниже).
# HTTPS-блок и редирект с HTTP допишет certbot — вручную их добавлять не нужно.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/portfolio;
    index index.html;

    # ── Логи отдельно от общих: проще искать проблемы именно этого сайта ──
    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log;

    # ── Сжатие. Экономит ~70% на HTML/CSS/JS ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml application/pdf;

    # ── Заголовки безопасности ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: свои скрипты и стили + шрифты Google. Внешних скриптов на сайте нет,
    # поэтому 'unsafe-inline' нужен только для inline-стилей внутри index.html.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # ── Кэширование ──
    # HTML не кэшируем: иначе посетитель увидит старую версию после деплоя.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # content.js меняется при каждой правке текстов — тоже без долгого кэша.
    location = /content.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Остальная статика живёт долго: JS-логика и картинки меняются редко,
    # а при изменении файла достаточно дописать ?v=2 к ссылке.
    location ~* \.(js|css|png|jpe?g|gif|webp|svg|ico|woff2?|pdf|docx)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Маршрутизация ──
    location / {
        try_files $uri $uri/ =404;
    }

    # Скрытые файлы наружу не отдаём
    location ~ /\. {
        deny all;
    }
}
